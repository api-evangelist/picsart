aid: picsart
name: Picsart
description: >-
  Picsart is a creative-technology company whose Picsart Enterprise / Creative
  APIs let developers add photo editing, video editing, and generative AI to their
  own products. The platform spans Programmable Image APIs (remove background,
  upscale, ultra enhance, face enhance, effects, adjust, blend, vectorize),
  Programmable Video APIs (FPS upscale, remove background, effects, trim, crop,
  concat, transcribe), GenAI APIs (text2image, text2sticker, logo, inpaint,
  outpaint, expand, text2video, image2video, text2speech, text2sound) via an AI
  Hub of 140+ models across 28 providers, and Variable Data Content APIs. All
  APIs are REST, authenticated with an X-Picsart-API-Key header, and are also
  reachable through first-party TypeScript/Python/Java SDKs, a gen-ai CLI, and an
  official hosted MCP server. Surfaced originally as a portfolio company of
  DCM Ventures and SoftBank Vision Fund and enriched into the API Evangelist
  network.
